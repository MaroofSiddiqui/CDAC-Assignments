<!DOCTYPE html>
<html>
<head>
    <title>CDAC Registration Form</title>

    <style>
        body {
            font-family: Arial;
            background: #e6e9ef;
        }

        .container {
            width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border: 1px solid #ccc;
        }

        /* HEADER */
        .header {
            text-align: center;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .header h2 {
            margin: 5px 0;
            font-size: 18px;
            color: #333;
        }

        /* SECTION */
        .section-title {
            margin-top: 20px;
            font-weight: bold;
            border-bottom: 1px solid #000;
            padding-bottom: 5px;
        }

        /* FORM LAYOUT */
        .row {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .col {
            flex: 1;
        }

        label {
            display: block;
            font-size: 14px;
            margin-top: 8px;
        }

        input, select {
            width: 100%;
            padding: 6px;
            margin-top: 3px;
            border: 1px solid #999;
        }

        .inline {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }

        /* DATE BOX */
        .date-box input {
            width: 40px;
            text-align: center;
        }

        /* SIGNATURE */
        .signature {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
        }

        .line {
            width: 200px;
            border-top: 1px solid black;
            text-align: center;
            padding-top: 5px;
        }

        /* FOOTER */
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <h1>CDAC</h1>
        <h2>Student Registration Form</h2>
    </div>

    <!-- DATE -->
    <div style="text-align:right; margin-top:10px;">
        <b>Date:</b>
        <span class="date-box">
            <input type="text"> /
            <input type="text"> /
            <input type="text">
        </span>
    </div>

    <!-- PERSONAL INFO -->
    <div class="section-title">PERSONAL INFORMATION</div>

    <div class="row">
        <div class="col">
            <label>Full Name</label>
            <input type="text">

            <label>Date of Birth</label>
            <div class="date-box">
                <input type="text"> /
                <input type="text"> /
                <input type="text">
            </div>

            <label>Gender</label>
            <div class="inline">
                <input type="radio" name="g"> Male
                <input type="radio" name="g"> Female
            </div>

            <label>Email</label>
            <input type="email">

            <label>Phone</label>
            <input type="text">
        </div>

        <div class="col">
            <label>Nationality</label>
            <input type="text">

            <label>State</label>
            <input type="text">

            <label>City</label>
            <input type="text">

            <label>Pin Code</label>
            <input type="text">

            <label>Course Applied</label>
            <select>
                <option>PGCP-AC</option>
                <option>PGCP-BDA</option>
                <option>PGCP-AI</option>
            </select>
        </div>
    </div>

    <!-- ADDRESS -->
    <div class="section-title">ADDRESS DETAILS</div>

    <div class="row">
        <div class="col">
            <label>Present Address</label>
            <input type="text">

            <label>Permanent Address</label>
            <input type="text">
        </div>

        <div class="col">
            <label>Guardian Name</label>
            <input type="text">

            <label>Guardian Contact</label>
            <input type="text">
        </div>
    </div>

    <!-- SIGNATURE -->
    <div class="signature">
        <div class="line">Student Signature</div>
        <div class="line">Authority Signature</div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        <p>Note: Fill all details correctly. Incomplete forms will be rejected.</p>
    </div>

</div>

</body>
</html>
