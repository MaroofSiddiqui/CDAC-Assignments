<!DOCTYPE html>
<html>
<head>
    <title>CDAC Contact Us</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f0f2f5;
        }

        /* HEADER */
        .header {
            background-color: #003366;
            color: white;
            text-align: center;
            padding: 15px;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
        }

        .header p {
            margin: 5px 0;
            font-size: 13px;
        }

        /* CONTAINER */
        .container {
            width: 800px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border: 1px solid #ccc;
        }

        h2 {
            text-align: center;
            border-bottom: 1px solid black;
            padding-bottom: 5px;
        }

        /* FORM */
        .form-group {
            margin-top: 15px;
        }

        label {
            display: block;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #999;
        }

        textarea {
            resize: none;
        }

        button {
            margin-top: 20px;
            padding: 10px;
            width: 100%;
            background-color: #003366;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #0055aa;
        }

        /* CONTACT INFO */
        .info {
            margin-top: 30px;
            font-size: 14px;
            line-height: 1.6;
        }

        /* FOOTER */
        .footer {
            text-align: center;
            font-size: 12px;
            margin-top: 20px;
            color: #555;
        }

    </style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <h1>Centre for Development of Advanced Computing (CDAC)</h1>
    <p>Contact Support</p>
</div>

<!-- MAIN -->
<div class="container">

    <h2>Contact Us</h2>

    <!-- FORM -->
    <form>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" required>
        </div>

        <div class="form-group">
            <label>Subject</label>
            <input type="text">
        </div>

        <div class="form-group">
            <label>Message</label>
            <textarea rows="5" required></textarea>
        </div>

        <button type="submit">Submit</button>

    </form>

    <!-- CONTACT DETAILS -->
    <div class="info">
        <p><strong>CDAC Headquarters:</strong></p>
        <p>Pune, Maharashtra, India</p>
        <p>Email: support@cdac.in</p>
        <p>Phone: +91-20-25503100</p>
    </div>

</div>

<!-- FOOTER -->
<div class="footer">
    <p>© CDAC | All Rights Reserved</p>
</div>

</body>
</html>
