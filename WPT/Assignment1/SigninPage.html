<!DOCTYPE html>
<html>
<head>
    <title>CDAC Signin</title>

    <style>
        body {
            font-family: Arial;
            background: #f0f2f5;
        }

        .box {
            width: 320px;
            margin: 100px auto;
            background: white;
            padding: 20px;
            border: 1px solid #ccc;
        }

        h2 {
            text-align: center;
            border-bottom: 1px solid black;
            padding-bottom: 5px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 7px;
            margin-top: 5px;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 8px;
            background: #003366;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>CDAC Signin</h2>

    <form>
        <label>Email</label>
        <input type="text">

        <label>Password</label>
        <input type="password">

        <button>Sign In</button>
    </form>
</div>

</body>
</html>
