<!DOCTYPE html>
<html>
<head>
    <title>CDAC Sign up</title>

    <style>
        body {
            font-family: Arial;
            background: #eef2f7;
        }

        .container {
            width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border: 1px solid #ccc;
        }

        h1 {
            text-align: center;
            color: #003366;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input, select {
            width: 100%;
            padding: 6px;
            margin-top: 5px;
        }

        .full {
            grid-column: span 2;
        }

        button {
            margin-top: 20px;
            padding: 10px;
            width: 100%;
            background: #003366;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<div class="container">

<h1>CDAC Sign up</h1>

<form class="grid">

    <div class="full">
        <label>Full Name</label>
        <input type="text">
    </div>

    <div>
        <label>Email</label>
        <input type="email">
    </div>

    <div>
        <label>Phone</label>
        <input type="text">
    </div>

    <div>
        <label>Password</label>
        <input type="password">
    </div>

    <div>
        <label>Confirm Password</label>
        <input type="password">
    </div>

    <div>
        <label>Course</label>
        <select>
            <option>PGCP-AC</option>
            <option>PGCP-BDA</option>
            <option>PGCP-AI</option>
        </select>
    </div>

    <div>
        <label>City</label>
        <input type="text">
    </div>

    <div class="full">
        <label>Address</label>
        <input type="text">
    </div>

    <div class="full">
        <button>Register</button>
    </div>

</form>

</div>

</body>
</html>
